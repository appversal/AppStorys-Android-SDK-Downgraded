# STR smoke — story circles render on the home screen.
# GROUP_NAME: the story group's name as set in the dashboard (rendered as
# text under its circle). Override per run:
#   maestro test str_smoke.yaml -e GROUP_NAME="My Group"
appId: com.example.carousal
env:
  SCREEN_NAV_TAB: "Lab"
  GROUP_NAME: "GGs"
---
- launchApp:
    stopApp: true
    clearState: false

# ── Navigate to the campaign's OWN screen ────────────────────────────────
# The SDK only renders a campaign on the screen the host app last reported via
# getScreenCampaigns(). SCREEN_NAV_TAB is injected by Layer 4 from the
# campaign's `screen` field; the default below is only for standalone runs.
# Tapping the tab that is already selected is a harmless no-op, so this is safe
# even when the campaign lives on the app's default screen.
- tapOn:
    text: "${SCREEN_NAV_TAB}"
    # optional: a campaign with a full-screen backdrop covers the bottom
    # nav, making the tab untappable even though the campaign is already
    # on its correct screen. The assertion below stays the real oracle.
    optional: true
- waitForAnimationToEnd

# Story circles load after the SDK fetches campaigns — wait, don't sleep.
# Generous: cold launch refetches campaign JSON + slide media on slow wifi.
- extendedWaitUntil:
    visible: "${GROUP_NAME}"
    timeout: 30000
- takeScreenshot: "str_01_circles"

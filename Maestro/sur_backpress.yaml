# ============================================================
# SUR — Back press dismisses survey sheet, app stays foreground
# SurveyBottomSheet uses Dialog(dismissOnBackPress = true).
# Back must close ONLY the survey — never the screen behind it.
# ============================================================
appId: com.example.carousal
---
- launchApp:
    stopApp: true
    clearState: false

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Close"
    timeout: 12000

- takeScreenshot: "sur_backpress_01_shown"

- pressKey: back

- waitForAnimationToEnd

- extendedWaitUntil:
    notVisible: "Close"
    timeout: 6000

- extendedWaitUntil:
    visible: "More"
    timeout: 12000

- takeScreenshot: "sur_backpress_02_PASS"

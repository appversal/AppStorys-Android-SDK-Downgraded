# ============================================================
# BTS — CTA: tap bottom sheet CTA button, verify action
# ============================================================
appId: com.example.carousal
---
- launchApp:
    clearState: false

- waitForAnimationToEnd

- tapOn:
    text: "Open Bottom Sheet"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Close"
    timeout: 12000

- takeScreenshot: "bts_before_cta"

# Tap the CTA button (bottom of sheet — 85% down screen)
- tapOn:
    point: "50%,85%"

- waitForAnimationToEnd

- pressKey: back

- waitForAnimationToEnd

- takeScreenshot: "bts_cta_PASS"

# STR studio CTA — tap a CTA that has a redirectUrl, prove the redirect


















# actually fired, then come back and prove the app survived it.
#
# WHY THIS EXISTS: story CTA redirects had zero coverage. str_view and
# str_studio deliberately avoid CTAs, and the flows that do tap a CTA
# (ban_interaction, mod_cta, ...) "handle" the browser with a bare
#     - pressKey: back        # If CTA opened browser, go back
# which asserts nothing. If the redirect silently never fires, back just
# dismisses something else and the flow still passes — a false green.
#
# WHY NOT pressKey: back HERE: SDK bug #6 — the overlayElements BackHandler
# recurses and crashes the app with StackOverflowError when no back_press
# campaign is armed. Pressing back is exactly how you would return from
# Chrome, so story redirects were untestable. `launchApp: stopApp: false`
# resumes the existing task instead, so the app never sees a back press.
#
# The pipeline injects CTA_POINT (centre of the first CTA that actually has a
# redirectUrl, clamped to the screen), CTA_URL, and CTA_SLIDE_TAPS/
# CTA_HAS_TAPS to reach its slide. Targeting is by POINT, never by text: a
# slide routinely holds two CTAs both labelled "Shop Now" where only one
# redirects, and Maestro would tap whichever it matched first.
#
# PASS  = tapping the CTA lands the browser on the CTA's own host, and the app
#         is intact on return.
# FAIL  = the browser never reached that host (tap missed the CTA, or the
#         redirect never fired), or the app is dead/blank when resumed.
#
# Manual run:
#   maestro test str_cta_redirect.yaml -e CTA_POINT="89%,46%" -e CTA_SLIDE_TAPS=0 -e CTA_HAS_TAPS=false
appId: com.example.carousal
env:
  SCREEN_NAV_TAB: "Lab"
  GROUP_NAME: "GGs"
  CTA_POINT: "89%,46%"
  CTA_URL_HOST: "example.com"
  CTA_SLIDE_TAPS: "0"
  CTA_HAS_TAPS: "false"
  ADVANCE_POINT: "95%,70%"
---
- launchApp:
    stopApp: true
    clearState: false

# ── Navigate to the campaign's OWN screen ────────────────────────────────
# The SDK only renders a campaign on the screen the host app last reported via
# getScreenCampaigns(). SCREEN_NAV_TAB is injected by Layer 4 from the
# campaign's `screen` field; the default below is only for standalone runs.
# Tapping the tab that is already selected is a harmless no-op, so this is safe
# even when the campaign lives on the app's default screen.
- tapOn:
    text: "${SCREEN_NAV_TAB}"
    # optional: a campaign with a full-screen backdrop covers the bottom
    # nav, making the tab untappable even though the campaign is already
    # on its correct screen. The assertion below stays the real oracle.
    optional: true
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "${GROUP_NAME}"
    timeout: 30000

# One tap only — retry-tap would land on the opened viewer and navigate it.
# BUDGET: slides auto-advance after ~5s, and the CTA tap below must land while
# ITS slide is still showing. Everything between here and that tap spends that
# budget, so the settle wait is kept short — the viewer opening is confirmed by
# the CTA tap succeeding, not by burning 2s waiting for the UI to go quiet.
- tapOn:
    text: "${GROUP_NAME}"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500

# Reach the slide carrying the redirecting CTA
- runFlow:
    when:
      true: ${CTA_HAS_TAPS}
    commands:
      - repeat:
          times: ${CTA_SLIDE_TAPS}
          commands:
            - tapOn:
                point: "${ADVANCE_POINT}"
                retryTapIfNoChange: false

# NOTE: there used to be another `extendedWaitUntil visible GROUP_NAME` here.
# It was removed for two reasons. It proved nothing — the group name shows on
# the circles row AND in the viewer header, so it cannot tell whether the
# viewer actually opened. And it cost a full hierarchy dump (~1-2s) out of the
# ~5s slide budget, which is what pushed the tap past the auto-advance.

# Fire the redirect IMMEDIATELY. Stories auto-advance on their own timer, so
# every round-trip between the viewer opening and this tap is a chance for the
# slide to change underneath us — the CTA is then no longer at CTA_POINT, the
# redirect never fires, and the flow fails for a reason that is not a product
# bug. A "before" screenshot used to sit right here and spent ~1-2s of that
# budget; it now runs AFTER the tap, which costs nothing and still proves what
# was on screen. Measured flakiness before this change: 2 failures in 7 runs.
#
# The CTA must be hit by POINT, not by text: a slide routinely carries two CTAs
# labelled "Shop Now" and only one of them has a redirectUrl.
- tapOn:
    point: "${CTA_POINT}"
    retryTapIfNoChange: false
- takeScreenshot: "str_08_cta_tapped"

# THE CHECK — POSITIVE oracle. This used to assert `notVisible GROUP_NAME`,
# which passes vacuously whenever the header is absent for ANY reason (viewer
# still animating, story auto-closed, app backgrounded) and so could not tell a
# real redirect from a missed tap. Assert instead that the browser actually
# landed on the CTA's host: the address bar renders it as plain text (verified
# on device — opening https://example.com shows text="example.com").
# CTA_URL_HOST is derived from the campaign's own redirectUrl by buildFlowEnv.
- extendedWaitUntil:
    visible: "${CTA_URL_HOST}"
    timeout: 10000
- takeScreenshot: "str_09_redirected"

# Return WITHOUT a back press (SDK bug #6). stopApp:false resumes the running
# task rather than restarting it, so this also proves the app survived being
# backgrounded mid-story.
- launchApp:
    stopApp: false

- extendedWaitUntil:
    visible: "Parties"
    timeout: 10000
- takeScreenshot: "str_10_returned_PASS"
